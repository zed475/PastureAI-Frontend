<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PastureAI - Ethiopia NDVI Map Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .pulse-animation {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-animation {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // Weather Service (Open-Meteo API)
    const monitoringStations = [
      { name: 'Jijiga', lat: 9.45, lon: 42.80, region: 'Somali', baseNdvi: 0.42 },
      { name: 'Mustahil', lat: 6.85, lon: 44.78, region: 'Somali', baseNdvi: 0.31 },
      { name: 'Danan', lat: 7.25, lon: 43.55, region: 'Somali', baseNdvi: 0.35 },
      { name: 'Warder', lat: 8.10, lon: 43.50, region: 'Somali', baseNdvi: 0.38 },
      { name: 'Goba', lat: 7.00, lon: 39.98, region: 'Oromia', baseNdvi: 0.52 },
      { name: 'Yabelo', lat: 4.88, lon: 38.08, region: 'Oromia', baseNdvi: 0.45 },
      { name: 'Semera', lat: 11.80, lon: 41.00, region: 'Afar', baseNdvi: 0.29 },
      { name: 'Gewane', lat: 11.23, lon: 40.52, region: 'Afar', baseNdvi: 0.32 }
    ];

    function getSeasonalFactor(month) {
      if (month >= 2 && month <= 4) return 0.05;
      if (month >= 5 && month <= 7) return 0.12;
      if (month === 11 || month === 0 || month === 1) return -0.08;
      return 0;
    }

    function calculateIndices(tempMax, rainSum7Day) {
      const droughtScore = Math.max(0, Math.min(100,
        (tempMax > 35 ? (tempMax - 35) * 5 : 0) +
        (rainSum7Day < 5 ? (5 - rainSum7Day) * 4 : 0)
      ));
      const heatScore = Math.max(0, Math.min(100, tempMax > 30 ? (tempMax - 30) * 3.33 : 0));
      return { drought: droughtScore, heatStress: heatScore };
    }

    function getColor(ndvi) {
      if (ndvi >= 0.5) return '#22c55e';
      if (ndvi >= 0.4) return '#84cc16';
      if (ndvi >= 0.35) return '#eab308';
      if (ndvi >= 0.3) return '#f97316';
      return '#ef4444';
    }

    function getStatus(ndvi) {
      if (ndvi < 0.3) return { label: 'Critical', color: 'text-red-600 bg-red-50 border-red-200' };
      if (ndvi < 0.35) return { label: 'Severe', color: 'text-orange-600 bg-orange-50 border-orange-200' };
      if (ndvi < 0.4) return { label: 'Warning', color: 'text-yellow-600 bg-yellow-50 border-yellow-200' };
      if (ndvi < 0.5) return { label: 'Moderate', color: 'text-lime-600 bg-lime-50 border-lime-200' };
      return { label: 'Healthy', color: 'text-green-600 bg-green-50 border-green-200' };
    }

    function getPosition(lat, lon) {
      const x = ((lon - 33) / 15) * 100;
      const y = ((15 - lat) / 12) * 90;
      return { x: Math.max(5, Math.min(95, x)), y: Math.max(5, Math.min(85, y)) };
    }

    async function fetchStationWeather(station) {
      try {
        const params = new URLSearchParams({
          latitude: station.lat.toString(),
          longitude: station.lon.toString(),
          current: 'temperature_2m,relative_humidity_2m,rain,wind_speed_10m',
          daily: 'rain_sum,temperature_2m_max,temperature_2m_min',
          timezone: 'Africa/Addis_Ababa',
          forecast_days: '7'
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error('Weather API error');
        
        const data = await response.json();
        const current = data.current;
        const daily = data.daily;
        
        const rainSum7Day = daily.rain_sum.slice(-7).reduce((sum, val) => sum + val, 0);
        const { drought, heatStress } = calculateIndices(
          daily.temperature_2m_max[daily.temperature_2m_max.length - 1],
          rainSum7Day
        );

        const weather = {
          temperature: current.temperature_2m,
          humidity: current.relative_humidity_2m,
          rainfall: current.rain,
          windSpeed: current.wind_speed_10m,
          rainSum7Day,
          tempMax: daily.temperature_2m_max[daily.temperature_2m_max.length - 1],
          tempMin: daily.temperature_2m_min[daily.temperature_2m_min.length - 1],
          droughtIndex: drought,
          heatStressIndex: heatStress
        };

        const month = new Date().getMonth();
        const seasonal = getSeasonalFactor(month);
        const rainBoost = Math.min(0.08, (weather.rainSum7Day / 40) * 0.08);
        const droughtPenalty = (weather.droughtIndex / 100) * 0.12;
        const heatPenalty = (weather.heatStressIndex / 100) * 0.04;
        let ndvi = station.baseNdvi + seasonal + rainBoost - droughtPenalty - heatPenalty;
        ndvi = Math.max(0.1, Math.min(0.82, ndvi));

        return {
          station: station.name,
          lat: station.lat,
          lon: station.lon,
          weather,
          calculatedNdvi: ndvi,
          lastUpdated: new Date().toISOString()
        };
      } catch (error) {
        console.error(`Failed to fetch weather for ${station.name}:`, error);
        return {
          station: station.name,
          lat: station.lat,
          lon: station.lon,
          weather: {
            temperature: 25 + Math.random() * 10,
            humidity: 40 + Math.random() * 30,
            rainfall: Math.random() * 5,
            windSpeed: 10 + Math.random() * 15,
            rainSum7Day: Math.random() * 20,
            tempMax: 30 + Math.random() * 8,
            tempMin: 15 + Math.random() * 5,
            droughtIndex: 30 + Math.random() * 40,
            heatStressIndex: 20 + Math.random() * 50
          },
          calculatedNdvi: station.baseNdvi + (Math.random() - 0.5) * 0.1,
          lastUpdated: new Date().toISOString()
        };
      }
    }

    function App() {
      const [viewMode, setViewMode] = useState('satellite');
      const [selectedStation, setSelectedStation] = useState(null);
      const [stationData, setStationData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [lastUpdated, setLastUpdated] = useState('');

      const loadWeatherData = useCallback(async () => {
        setIsLoading(true);
        try {
          const results = await Promise.all(
            monitoringStations.map(station => fetchStationWeather(station))
          );
          setStationData(results);
          setLastUpdated(new Date().toLocaleString('en-US', { 
            timeZone: 'Africa/Addis_Ababa',
            hour12: false 
          }));
        } catch (err) {
          console.error('Failed to load weather:', err);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        loadWeatherData();
        const interval = setInterval(loadWeatherData, 300000);
        return () => clearInterval(interval);
      }, [loadWeatherData]);

      const selectedData = stationData.find(s => s.station === selectedStation);

      const getBackground = () => {
        switch (viewMode) {
          case 'satellite':
            return 'linear-gradient(135deg, #1a472a 0%, #2d5a27 25%, #4a7c39 45%, #8b9d77 70%, #d4c5a9 88%, #e8dcc8 100%)';
          case 'terrain':
            return 'linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 20%, #90EE90 35%, #228B22 55%, #8B4513 75%, #D2691E 100%)';
          case 'heatmap':
            return 'radial-gradient(ellipse at 75% 30%, rgba(239,68,68,0.3) 0%, transparent 40%), radial-gradient(ellipse at 80% 55%, rgba(249,115,22,0.3) 0%, transparent 35%), radial-gradient(ellipse at 35% 70%, rgba(234,179,8,0.3) 0%, transparent 38%), radial-gradient(ellipse at 42% 48%, rgba(132,204,22,0.3) 0%, transparent 42%), linear-gradient(135deg, #1e293b 0%, #334155 100%)';
          case 'stations':
            return 'linear-gradient(135deg, #f8fafc 0%, #e2e8f4 100%)';
          default:
            return '#1a472a';
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          {/* Header */}
          <div className="max-w-6xl mx-auto mb-6">
            <div className="flex items-center justify-between p-4 bg-gradient-to-r from-green-50 to-blue-50 rounded-xl border border-green-200 shadow-sm">
              <div className="flex items-center gap-3">
                <span className="text-3xl">🛰️</span>
                <div>
                  <h1 className="text-2xl font-bold text-gray-800">PastureAI - Ethiopia Livestock Early Warning System</h1>
                  <p className="text-sm text-gray-600">Real-time NDVI Monitoring with Open-Meteo Weather Data</p>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-green-100 rounded-full">
                <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span className="text-sm font-medium text-green-700">Live Data</span>
              </div>
            </div>
            
            {lastUpdated && (
              <p className="text-xs text-gray-500 mt-2 text-right">Last updated: {lastUpdated}</p>
            )}
          </div>

          {/* Map Controls */}
          <div className="max-w-6xl mx-auto mb-4 flex flex-wrap gap-2 p-3 bg-white rounded-lg shadow-sm border">
            <span className="text-sm font-medium text-gray-600 mr-2 self-center">View Mode:</span>
            {['satellite', 'terrain', 'heatmap', 'stations'].map(mode => (
              <button
                key={mode}
                onClick={() => setViewMode(mode)}
                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                  viewMode === mode
                    ? 'bg-green-600 text-white shadow-md'
                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                }`}
              >
                {mode === 'satellite' && '🛰️ '}
                {mode === 'terrain' && '🗺️ '}
                {mode === 'heatmap' && '🌡️ '}
                {mode === 'stations' && '📍 '}
                {mode.charAt(0).toUpperCase() + mode.slice(1)}
              </button>
            ))}
            
            <button
              onClick={loadWeatherData}
              disabled={isLoading}
              className="ml-auto px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 flex items-center gap-2"
            >
              <svg className={`w-4 h-4 ${isLoading ? 'spin-animation' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              Refresh Data
            </button>
          </div>

          {/* THE MAP */}
          <div 
            className="max-w-6xl mx-auto relative w-full rounded-xl border-2 border-gray-300 overflow-hidden shadow-lg"
            style={{ height: '550px', background: getBackground() }}
          >
            {/* Loading Overlay */}
            {isLoading && (
              <div className="absolute inset-0 bg-white/80 z-50 flex items-center justify-center">
                <div className="flex flex-col items-center gap-3">
                  <svg className="w-10 h-10 text-green-600 spin-animation" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span className="text-gray-600 font-medium">Fetching live satellite & weather data...</span>
                  <span className="text-xs text-gray-400">Connecting to Open-Meteo API</span>
                </div>
              </div>
            )}

            {/* SVG Map Outline */}
            <svg viewBox="0 0 100 90" className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
              <defs>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
                  <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>
              
              <path
                d="M 28 8 L 38 6 L 52 10 L 66 8 L 78 14 L 86 24 L 89 38 L 86 52 L 82 65 L 72 76 L 58 84 L 42 81 L 30 74 L 20 61 L 14 47 L 17 32 L 22 19 Z"
                fill={viewMode === 'heatmap' ? 'rgba(51,65,85,0.3)' : 'none'}
                stroke="rgba(255,255,255,0.6)"
                strokeWidth="0.8"
                filter="url(#glow)"
              />
              
              <text x="68" y="40" fill="rgba(255,255,255,0.8)" fontSize="3" fontWeight="bold" opacity="0.9">SOMALI</text>
              <text x="34" y="56" fill="rgba(255,255,255,0.8)" fontSize="3" fontWeight="bold" opacity="0.9">OROMIA</text>
              <text x="48" y="18" fill="rgba(255,255,255,0.8)" fontSize="3" fontWeight="bold" opacity="0.9">AFAR</text>
            </svg>

            {/* Station Markers */}
            {stationData.map((data) => {
              const pos = getPosition(data.lat, data.lon);
              const color = getColor(data.calculatedNdvi);
              const status = getStatus(data.calculatedNdvi);
              const isSelected = selectedStation === data.station;

              return (
                <div
                  key={data.station}
                  onClick={() => setSelectedStation(isSelected ? null : data.station)}
                  className="absolute cursor-pointer transition-all duration-200 group"
                  style={{
                    left: `${pos.x}%`,
                    top: `${pos.y}%`,
                    transform: `translate(-50%, -50%) scale(${isSelected ? 1.15 : 1})`,
                    zIndex: isSelected ? 20 : 10
                  }}
                >
                  {data.calculatedNdvi < 0.35 && (
                    <div 
                      className="absolute inset-0 rounded-full pulse-animation opacity-75"
                      style={{ backgroundColor: color, width: '28px', height: '28px', transform: 'scale(1.5)' }}
                    />
                  )}
                  
                  <div
                    className="rounded-full border-2 shadow-lg flex items-center justify-center text-white text-xs font-bold transition-all duration-200"
                    style={{
                      backgroundColor: color,
                      width: isSelected ? '36px' : '28px',
                      height: isSelected ? '36px' : '28px',
                      borderColor: isSelected ? '#fff' : 'rgba(255,255,255,0.9)',
                      boxShadow: isSelected ? `0 0 20px ${color}80` : '0 2px 8px rgba(0,0,0,0.3)'
                    }}
                  >
                    {Math.round(data.calculatedNdvi * 100)}
                  </div>
                  
                  {(isSelected) && (
                    <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 whitespace-nowrap z-30">
                      <div className="bg-slate-900 text-white px-3 py-2 rounded-lg shadow-xl text-xs border border-slate-700">
                        <div className="font-bold text-sm mb-1">{data.station}</div>
                        <div className="text-slate-300">{monitoringStations.find(s => s.name === data.station)?.region} Region</div>
                        <div className="mt-1.5 pt-1.5 border-t border-slate-700 grid grid-cols-2 gap-x-3 gap-y-1">
                          <div>
                            <span className="text-slate-400">NDVI:</span>{' '}
                            <span className="font-bold" style={{color}}>{data.calculatedNdvi.toFixed(3)}</span>
                          </div>
                          <div>
                            <span className="text-slate-400">Status:</span>{' '}
                            <span className={`font-semibold`}>{status.label}</span>
                          </div>
                          <div className="col-span-2 flex items-center gap-1 mt-1 pt-1 border-t border-slate-700">
                            <span>🌡️</span> <span>{data.weather.temperature.toFixed(1)}°C</span>
                            <span className="ml-2">💧</span> <span>{data.weather.humidity.toFixed(0)}%</span>
                          </div>
                        </div>
                        <div className="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-slate-900 rotate-45 border-r border-b border-slate-700"></div>
                      </div>
                    </div>
                  )}
                  
                  {viewMode === 'stations' && (
                    <div className="absolute top-full left-1/2 transform -translate-x-1/2 mt-1 whitespace-nowrap">
                      <span className="text-xs font-medium text-gray-800 bg-white/90 px-1.5 py-0.5 rounded shadow-sm">
                        {data.station}
                      </span>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Scale Bar */}
            <div className="absolute bottom-3 left-3 bg-white/95 backdrop-blur px-3 py-1.5 rounded-lg text-xs shadow-md border border-gray-200">
              <div className="flex items-center gap-2">
                <div className="w-16 h-1.5 bg-gradient-to-r from-gray-800 via-gray-500 to-gray-300 rounded-sm"></div>
                <span className="font-medium text-gray-700">100 km</span>
              </div>
            </div>

            {/* Compass */}
            <div className="absolute top-3 right-3 bg-white/95 backdrop-blur rounded-full w-10 h-10 flex items-center justify-center shadow-md border border-gray-200 text-red-600 font-bold">
              🧭
            </div>

            {/* Title Overlay */}
            <div className="absolute top-3 left-3 bg-black/70 backdrop-blur-sm text-white px-4 py-2 rounded-lg text-xs shadow-lg max-w-xs">
              <div className="font-bold flex items-center gap-2">
                🛰️ Ethiopia Pastoral Regions
              </div>
              <div className="text-gray-300 mt-0.5">Live NDVI Monitoring Stations</div>
              {stationData.length > 0 && (
                <div className="mt-1.5 pt-1.5 border-t border-white/20 text-[10px] text-gray-400">
                  Avg NDVI: {(stationData.reduce((sum, s) => sum + s.calculatedNdvi, 0) / stationData.length).toFixed(2)} | 
                  Critical: {stationData.filter(s => s.calculatedNdvi < 0.35).length}
                </div>
              )}
            </div>
          </div>

          {/* Selected Station Info */}
          {selectedStation && selectedData && (
            <div className="max-w-6xl mx-auto mt-4 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-5 shadow-lg">
              <div className="flex items-start justify-between">
                <div className="flex-1">
                  <h4 className="font-bold text-lg text-gray-800 flex items-center gap-2 mb-1">
                    📍 {selectedData.station} Monitoring Station
                  </h4>
                  <p className="text-sm text-gray-600 mb-4">
                    {monitoringStations.find(s => s.name === selectedStation)?.region} Region • 
                    Coords: {selectedData.lat.toFixed(2)}°N, {selectedData.lon.toFixed(2)}°E
                  </p>
                  
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div className="bg-white rounded-lg p-3 shadow-sm border">
                      <div className="text-xs text-gray-500 uppercase tracking-wide mb-1">NDVI Value</div>
                      <div className="text-2xl font-bold" style={{color: getColor(selectedData.calculatedNdvi)}}>
                        {selectedData.calculatedNdvi.toFixed(3)}
                      </div>
                      <div className={`inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-medium border ${getStatus(selectedData.calculatedNdvi).color}`}>
                        {getStatus(selectedData.calculatedNdvi).label}
                      </div>
                    </div>

                    <div className="bg-white rounded-lg p-3 shadow-sm border">
                      <div className="text-xs text-gray-500 uppercase tracking-wide mb-1">🌡️ Temperature</div>
                      <div className="text-2xl font-bold text-orange-600">{selectedData.weather.temperature.toFixed(1)}°C</div>
                      <div className="text-xs text-gray-500 mt-1">H: {selectedData.weather.tempMax.toFixed(0)}° / L: {selectedData.weather.tempMin.toFixed(0)}°</div>
                    </div>

                    <div className="bg-white rounded-lg p-3 shadow-sm border">
                      <div className="text-xs text-gray-500 uppercase tracking-wide mb-1">💧 Precipitation</div>
                      <div className="text-2xl font-bold text-blue-600">{selectedData.weather.rainSum7Day.toFixed(1)}<span className="text-sm font-normal text-gray-500">mm</span></div>
                      <div className="text-xs text-gray-500 mt-1">7-day cumulative</div>
                    </div>

                    <div className="bg-white rounded-lg p-3 shadow-sm border">
                      <div className="text-xs text-gray-500 uppercase tracking-wide mb-1">Risk Indices</div>
                      <div className="space-y-1.5 mt-2">
                        <div>
                          <div className="flex justify-between text-xs mb-0.5">
                            <span>Drought</span>
                            <span className="font-medium">{selectedData.weather.droughtIndex.toFixed(0)}</span>
                          </div>
                          <div className="h-1.5 bg-gray-200 rounded-full overflow-hidden">
                            <div className="h-full rounded-full" style={{
                              width: `${selectedData.weather.droughtIndex}%`,
                              backgroundColor: selectedData.weather.droughtIndex > 60 ? '#ef4444' : selectedData.weather.droughtIndex > 30 ? '#eab308' : '#22c55e'
                            }}></div>
                          </div>
                        </div>
                        <div>
                          <div className="flex justify-between text-xs mb-0.5">
                            <span>Heat Stress</span>
                            <span className="font-medium">{selectedData.weather.heatStressIndex.toFixed(0)}</span>
                          </div>
                          <div className="h-1.5 bg-gray-200 rounded-full overflow-hidden">
                            <div className="h-full rounded-full" style={{
                              width: `${selectedData.weather.heatStressIndex}%`,
                              backgroundColor: selectedData.weather.heatStressIndex > 60 ? '#ef4444' : selectedData.weather.heatStressIndex > 30 ? '#eab308' : '#22c55e'
                            }}></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <button 
                  onClick={() => setSelectedStation(null)}
                  className="ml-4 p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors text-xl"
                >
                  ✕
                </button>
              </div>
            </div>
          )}

          {/* Statistics Cards */}
          {!isLoading && stationData.length > 0 && (
            <div className="max-w-6xl mx-auto mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-gradient-to-br from-red-50 to-red-100 border border-red-200 rounded-xl p-4 text-center shadow-sm">
                <div className="text-3xl font-bold text-red-600">{stationData.filter(s => s.calculatedNdvi < 0.3).length}</div>
                <div className="text-sm text-red-700 font-medium mt-1">🚨 Critical</div>
                <div className="text-xs text-red-600/70">NDVI &lt; 0.3</div>
              </div>
              <div className="bg-gradient-to-br from-orange-50 to-orange-100 border border-orange-200 rounded-xl p-4 text-center shadow-sm">
                <div className="text-3xl font-bold text-orange-600">{stationData.filter(s => s.calculatedNdvi >= 0.3 && s.calculatedNdvi < 0.4).length}</div>
                <div className="text-sm text-orange-700 font-medium mt-1">⚠️ Warning</div>
                <div className="text-xs text-orange-600/70">NDVI 0.3–0.4</div>
              </div>
              <div className="bg-gradient-to-br from-green-50 to-green-100 border border-green-200 rounded-xl p-4 text-center shadow-sm">
                <div className="text-3xl font-bold text-green-600">{stationData.filter(s => s.calculatedNdvi >= 0.4).length}</div>
                <div className="text-sm text-green-700 font-medium mt-1">✅ Healthy</div>
                <div className="text-xs text-green-600/70">NDVI ≥ 0.4</div>
              </div>
              <div className="bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-200 rounded-xl p-4 text-center shadow-sm">
                <div className="text-3xl font-bold text-blue-600">{stationData.length}</div>
                <div className="text-sm text-blue-700 font-medium mt-1">📡 Total Stations</div>
                <div className="text-xs text-blue-600/70">Avg: {(stationData.reduce((sum, s) => sum + s.calculatedNdvi, 0) / stationData.length).toFixed(2)}</div>
              </div>
            </div>
          )}

          {/* Legend */}
          <div className="max-w-6xl mx-auto mt-4 bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
            <h5 className="font-semibold text-sm mb-3 text-gray-700">NDVI Vegetation Index Legend</h5>
            <div className="h-4 rounded-full mb-3 shadow-inner" style={{
              background: 'linear-gradient(to-right, #ef4444 0%, #f97316 20%, #eab308 40%, #84cc16 60%, #22c55e 80%, #16a34a 100%)'
            }}></div>
            <div className="grid grid-cols-5 gap-2 text-xs text-gray-600">
              <div className="text-center">
                <div className="w-4 h-4 rounded bg-red-500 mx-auto mb-1"></div>
                <span className="font-medium text-red-700">Critical</span><br/><span className="text-gray-400">&lt;0.30</span>
              </div>
              <div className="text-center">
                <div className="w-4 h-4 rounded bg-orange-500 mx-auto mb-1"></div>
                <span className="font-medium text-orange-700">Poor</span><br/><span className="text-gray-400">0.30–0.35</span>
              </div>
              <div className="text-center">
                <div className="w-4 h-4 rounded bg-yellow-500 mx-auto mb-1"></div>
                <span className="font-medium text-yellow-700">Moderate</span><br/><span className="text-gray-400">0.35–0.40</span>
              </div>
              <div className="text-center">
                <div className="w-4 h-4 rounded bg-lime-500 mx-auto mb-1"></div>
                <span className="font-medium text-lime-700">Good</span><br/><span className="text-gray-400">0.40–0.50</span>
              </div>
              <div className="text-center">
                <div className="w-4 h-4 rounded bg-green-500 mx-auto mb-1"></div>
                <span className="font-medium text-green-700">Excellent</span><br/><span className="text-gray-400">&gt;0.50</span>
              </div>
            </div>
            
            <div className="mt-4 pt-3 border-t border-gray-200 text-xs text-gray-500 text-center">
              <span>Data Source: <strong className="text-blue-600">Open-Meteo API (Live)</strong> | Ethiopian Seasonal Calibration Applied</span>
            </div>
          </div>

          {/* Footer */}
          <div className="max-w-6xl mx-auto mt-6 text-center text-xs text-gray-400 pb-4">
            <p>PastureAI - Ethiopia Livestock Early Warning System</p>
            <p className="mt-1">Powered by Open-Meteo Weather API • Real-time NDVI Monitoring</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
